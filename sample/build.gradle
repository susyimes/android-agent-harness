plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'dev.androidagent.harness.sample'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.androidagent.harness.sample'
        minSdk 29
        targetSdk 36
        versionCode 10
        versionName '0.5.2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation project(':agent-sdk')
    implementation project(':agent-sdk-android')
    implementation project(':agent-permission-android')
    implementation project(':agent-data-android')
    implementation project(':agent-scheduling')
    implementation project(':agent-scheduling-android')
    implementation project(':agent-feedback')
    implementation project(':agent-voice-android')
    implementation project(':harness-core')
    implementation project(':provider-openai')
    implementation project(':device-loop')
    implementation project(':device-loop-android')
    implementation project(':web4agent-android')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:core-ktx:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit-ktx:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
