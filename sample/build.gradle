plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'dev.androidagent.harness.sample'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.androidagent.harness.sample'
        // java.time (used by the provider configuration) is part of the Android
        // platform from API 26, so the sample app requires 26 without desugaring.
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation project(':harness-core')
    implementation project(':provider-openai')
    implementation project(':device-loop')
    implementation project(':device-loop-android')
}
