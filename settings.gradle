pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        maven {
            name = 'sdkLocal'
            url = uri(
                providers.gradleProperty('SDK_REPOSITORY_DIR')
                    .orElse("${rootDir}/build/sdk-candidate-repository")
                    .get()
            )
            content {
                includeGroup 'dev.androidagent.harness'
            }
        }
        google()
        mavenCentral()
    }
}

rootProject.name = 'android-agent-harness'
include ':harness-core'
include ':agent-sdk'
include ':agent-approval'
include ':context-engine'
include ':agent-state'
include ':agent-permission-android'
include ':agent-data-android'
include ':agent-scheduling'
include ':agent-scheduling-android'
include ':agent-feedback'
include ':agent-voice-android'
include ':provider-openai'
include ':harness-eval'
include ':device-loop'
include ':device-loop-android'
include ':web4agent-android'
include ':agent-sdk-android'
include ':demo'
include ':sample'
include ':sdk-consumer-smoke'
include ':sdk-android-consumer-smoke'
