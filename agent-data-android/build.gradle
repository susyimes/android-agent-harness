plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

android {
    namespace 'dev.androidagent.harness.data.android'
    compileSdk 36

    defaultConfig {
        minSdk 29
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    api project(':agent-sdk')
    api project(':agent-state')
    api project(':agent-approval')
    api project(':context-engine')
    api project(':agent-permission-android')
    testImplementation 'junit:junit:4.13.2'
}

afterEvaluate {
    publishing {
        publications {
            sdk(MavenPublication) {
                from components.release
                artifactId = 'agent-data-android'
            }
        }
    }
}
