name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  jvm-no-android-sdk:
    name: JVM path without Android SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run audit, JVM module tests, and demo
        run: env -u ANDROID_HOME -u ANDROID_SDK_ROOT ./gradlew auditProvenance :harness-core:test :agent-sdk:test :provider-openai:test :harness-eval:test :device-loop:test :sdk-consumer-smoke:test :demo:test :demo:run --console=plain

  full-check:
    name: Full check including Android modules and APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run checkM0 and Android library unit tests
        run: ./gradlew checkM0 checkSdk --console=plain
      - name: Upload sample debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sample-debug-apk
          path: sample/build/outputs/apk/debug/*.apk
          if-no-files-found: error
